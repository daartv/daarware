<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E0A0A"/>
      <stop offset="100%" stop-color="#0A0A12"/>
    </linearGradient>
    <linearGradient id="flame" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#8B1A1A"/>
      <stop offset="40%" stop-color="#C43030"/>
      <stop offset="100%" stop-color="#E85030"/>
    </linearGradient>
    <linearGradient id="body" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#3A1010"/>
      <stop offset="55%" stop-color="#2A0E0E"/>
      <stop offset="100%" stop-color="#180707"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A1818"/>
      <stop offset="50%" stop-color="#8B2020"/>
      <stop offset="100%" stop-color="#5A1818"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feFlood flood-color="#C43030" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feComposite in="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>

  <!-- Outer geometric border frame — octagonal -->
  <path d="M256 32 L400 80 L464 180 L464 332 L400 432 L256 480 L112 432 L48 332 L48 180 L112 80 Z"
    fill="none" stroke="url(#border)" stroke-width="4" opacity="0.6"/>

  <!-- Inner geometric border -->
  <path d="M256 56 L384 98 L440 190 L440 322 L384 414 L256 456 L128 414 L72 322 L72 190 L128 98 Z"
    fill="none" stroke="url(#border)" stroke-width="1.5" opacity="0.3"/>

  <!-- Corner accents -->
  <path d="M256 32 L256 56" stroke="#8B2020" stroke-width="2" opacity="0.5"/>
  <path d="M464 180 L440 190" stroke="#8B2020" stroke-width="2" opacity="0.5"/>
  <path d="M464 332 L440 322" stroke="#8B2020" stroke-width="2" opacity="0.5"/>
  <path d="M256 480 L256 456" stroke="#8B2020" stroke-width="2" opacity="0.5"/>
  <path d="M48 180 L72 190" stroke="#8B2020" stroke-width="2" opacity="0.5"/>
  <path d="M48 332 L72 322" stroke="#8B2020" stroke-width="2" opacity="0.5"/>

  <!-- Flame/spike crown — aggressive upward spikes -->
  <g filter="url(#glow)" opacity="0.9">
    <path d="M256 96 L248 156 L236 126 L228 171 L218 136 L212 181 L200 151 L196 191
             L256 206
             L316 191 L312 151 L300 181 L294 136 L284 171 L276 126 L264 156 Z"
      fill="url(#flame)" opacity="0.85"/>
    <path d="M196 191 L180 146 L175 196 L160 166 L165 206 L150 186 L158 221 L196 206 Z"
      fill="url(#flame)" opacity="0.5"/>
    <path d="M316 191 L332 146 L337 196 L352 166 L347 206 L362 186 L354 221 L316 206 Z"
      fill="url(#flame)" opacity="0.5"/>
  </g>

  <!-- Muscular V-taper torso — wide shoulders, defined chest, narrow waist -->
  <g filter="url(#innerGlow)">
    <!-- Traps + neck wedge -->
    <path d="M196 248 Q210 226 238 220 Q256 217 274 220 Q302 226 316 248
             L308 262 Q284 250 256 250 Q228 250 204 262 Z"
      fill="url(#body)" stroke="#5A1818" stroke-width="1.5"/>

    <!-- Left deltoid cap -->
    <path d="M198 246 Q166 240 146 256 Q126 274 128 304 Q130 322 144 332
             L168 326 Q160 302 168 282 Q180 260 202 256 Z"
      fill="url(#body)" stroke="#5A1818" stroke-width="1.5"/>
    <!-- Right deltoid cap -->
    <path d="M314 246 Q346 240 366 256 Q386 274 384 304 Q382 322 368 332
             L344 326 Q352 302 344 282 Q332 260 310 256 Z"
      fill="url(#body)" stroke="#5A1818" stroke-width="1.5"/>

    <!-- Torso: chest + abs tapering to waist -->
    <path d="M200 252
             Q190 256 186 270
             L182 302
             Q180 334 192 364
             L208 404 Q226 416 234 414 L250 394 L256 388 L262 394 L278 414
             Q286 416 304 404 L320 364
             Q332 334 330 302 L326 270 Q322 256 312 252
             Q286 247 256 246 Q226 247 200 252 Z"
      fill="url(#body)" stroke="#5A1818" stroke-width="1.5"/>

    <!-- Left upper arm + bicep -->
    <path d="M144 328 Q126 348 122 380 Q120 406 130 426
             L152 426 Q158 404 160 378 Q162 352 168 330 Z"
      fill="url(#body)" stroke="#5A1818" stroke-width="1.5"/>
    <!-- Right upper arm + bicep -->
    <path d="M368 328 Q386 348 390 380 Q392 406 382 426
             L360 426 Q354 404 352 378 Q350 352 344 330 Z"
      fill="url(#body)" stroke="#5A1818" stroke-width="1.5"/>

    <!-- Head -->
    <ellipse cx="256" cy="214" rx="22" ry="25"
      fill="url(#body)" stroke="#5A1818" stroke-width="1.5"/>
  </g>

  <!-- Muscle definition lines -->
  <g fill="none" stroke="#8B2020" stroke-width="2" opacity="0.55" stroke-linecap="round">
    <!-- Pec shelf -->
    <path d="M202 258 Q230 274 256 274 Q282 274 310 258"/>
    <!-- Sternum -->
    <path d="M256 268 L256 312"/>
    <!-- Pec under-curves -->
    <path d="M200 268 Q228 312 256 312"/>
    <path d="M312 268 Q284 312 256 312"/>
    <!-- Ab center line -->
    <path d="M256 314 L256 392"/>
    <!-- Ab cross lines -->
    <path d="M226 330 L286 330" opacity="0.4"/>
    <path d="M228 352 L284 352" opacity="0.4"/>
    <path d="M232 374 L280 374" opacity="0.4"/>
    <!-- Delt / arm separation -->
    <path d="M150 300 Q158 312 168 320" opacity="0.4"/>
    <path d="M362 300 Q354 312 344 320" opacity="0.4"/>
  </g>

  <!-- Glowing eyes -->
  <circle cx="247" cy="210" r="3" fill="#E85030" opacity="0.95" filter="url(#glow)"/>
  <circle cx="265" cy="210" r="3" fill="#E85030" opacity="0.95" filter="url(#glow)"/>

  <!-- Subtle scan line effect -->
  <g opacity="0.06">
    <line x1="48" y1="160" x2="464" y2="160" stroke="white" stroke-width="0.5"/>
    <line x1="48" y1="200" x2="464" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="48" y1="240" x2="464" y2="240" stroke="white" stroke-width="0.5"/>
    <line x1="48" y1="280" x2="464" y2="280" stroke="white" stroke-width="0.5"/>
    <line x1="48" y1="320" x2="464" y2="320" stroke="white" stroke-width="0.5"/>
    <line x1="48" y1="360" x2="464" y2="360" stroke="white" stroke-width="0.5"/>
    <line x1="48" y1="400" x2="464" y2="400" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Small "DW" text at bottom -->
  <text x="256" y="460" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold"
    fill="#5A1818" letter-spacing="6" opacity="0.5">DW</text>
</svg>
