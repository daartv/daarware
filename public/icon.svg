<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E0A0A"/>
      <stop offset="100%" stop-color="#0A0A12"/>
    </linearGradient>
    <linearGradient id="flame" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#8B1A1A"/>
      <stop offset="40%" stop-color="#C43030"/>
      <stop offset="100%" stop-color="#E85030"/>
    </linearGradient>
    <linearGradient id="body" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#1A0808"/>
      <stop offset="100%" stop-color="#2A0E0E"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A1818"/>
      <stop offset="50%" stop-color="#8B2020"/>
      <stop offset="100%" stop-color="#5A1818"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feFlood flood-color="#C43030" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feComposite in="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>

  <!-- Outer geometric border frame — octagonal -->
  <path d="M256 32 L400 80 L464 180 L464 332 L400 432 L256 480 L112 432 L48 332 L48 180 L112 80 Z"
    fill="none" stroke="url(#border)" stroke-width="4" opacity="0.6"/>

  <!-- Inner geometric border -->
  <path d="M256 56 L384 98 L440 190 L440 322 L384 414 L256 456 L128 414 L72 322 L72 190 L128 98 Z"
    fill="none" stroke="url(#border)" stroke-width="1.5" opacity="0.3"/>

  <!-- Corner accents -->
  <path d="M256 32 L256 56" stroke="#8B2020" stroke-width="2" opacity="0.5"/>
  <path d="M464 180 L440 190" stroke="#8B2020" stroke-width="2" opacity="0.5"/>
  <path d="M464 332 L440 322" stroke="#8B2020" stroke-width="2" opacity="0.5"/>
  <path d="M256 480 L256 456" stroke="#8B2020" stroke-width="2" opacity="0.5"/>
  <path d="M48 180 L72 190" stroke="#8B2020" stroke-width="2" opacity="0.5"/>
  <path d="M48 332 L72 322" stroke="#8B2020" stroke-width="2" opacity="0.5"/>

  <!-- Flame/spike crown — aggressive upward spikes -->
  <g filter="url(#glow)" opacity="0.9">
    <!-- Central flame spikes -->
    <path d="M256 100 L248 160 L236 130 L228 175 L218 140 L212 185 L200 155 L196 195
             L256 210
             L316 195 L312 155 L300 185 L294 140 L284 175 L276 130 L264 160 Z"
      fill="url(#flame)" opacity="0.85"/>

    <!-- Outer flame wisps -->
    <path d="M196 195 L180 150 L175 200 L160 170 L165 210 L150 190 L158 225 L196 210 Z"
      fill="url(#flame)" opacity="0.5"/>
    <path d="M316 195 L332 150 L337 200 L352 170 L347 210 L362 190 L354 225 L316 210 Z"
      fill="url(#flame)" opacity="0.5"/>
  </g>

  <!-- Body silhouette — muscular upper body, dark -->
  <g filter="url(#innerGlow)">
    <!-- Torso -->
    <path d="M256 210
             C240 210 220 215 210 225
             L195 240 C185 250 180 265 182 280
             L186 320 C188 340 192 355 198 370
             L208 400 L216 420 L240 420 L245 400 L250 385
             L256 380
             L262 385 L267 400 L272 420 L296 420 L304 400
             L314 370 C320 355 324 340 326 320
             L330 280 C332 265 327 250 317 240
             L302 225 C292 215 272 210 256 210Z"
      fill="url(#body)" stroke="#5A1818" stroke-width="1.5"/>

    <!-- Shoulder/arm masses -->
    <path d="M210 225 L190 230 C175 235 165 250 168 268
             L172 290 L182 285 L186 260 C188 248 195 238 205 232 Z"
      fill="url(#body)" stroke="#5A1818" stroke-width="1"/>
    <path d="M302 225 L322 230 C337 235 347 250 344 268
             L340 290 L330 285 L326 260 C324 248 317 238 307 232 Z"
      fill="url(#body)" stroke="#5A1818" stroke-width="1"/>

    <!-- Head silhouette -->
    <ellipse cx="256" cy="218" rx="22" ry="16"
      fill="url(#body)" stroke="#5A1818" stroke-width="1"/>
  </g>

  <!-- Glowing eyes -->
  <circle cx="248" cy="216" r="2.5" fill="#E85030" opacity="0.9" filter="url(#glow)"/>
  <circle cx="264" cy="216" r="2.5" fill="#E85030" opacity="0.9" filter="url(#glow)"/>

  <!-- Subtle scan line effect -->
  <g opacity="0.06">
    <line x1="48" y1="160" x2="464" y2="160" stroke="white" stroke-width="0.5"/>
    <line x1="48" y1="200" x2="464" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="48" y1="240" x2="464" y2="240" stroke="white" stroke-width="0.5"/>
    <line x1="48" y1="280" x2="464" y2="280" stroke="white" stroke-width="0.5"/>
    <line x1="48" y1="320" x2="464" y2="320" stroke="white" stroke-width="0.5"/>
    <line x1="48" y1="360" x2="464" y2="360" stroke="white" stroke-width="0.5"/>
    <line x1="48" y1="400" x2="464" y2="400" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Small "DW" text at bottom -->
  <text x="256" y="460" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold"
    fill="#5A1818" letter-spacing="6" opacity="0.5">DW</text>
</svg>
